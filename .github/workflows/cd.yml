name: CD

# Builds the macOS Release host that `Play ElonaPlus.command` launches and
# keeps it as a workflow artifact. This is a developer build, not an app
# package: running it still needs your own ElonaPlus 2.335 and a prepared
# workspace (see docs/DEVELOPMENT.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-release:
    name: macOS arm64 Release build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Cache pinned upstream inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/upstream/OpenHSP
            .cache/audio
            .cache/macos-gui
          key: upstream-macos-release-${{ hashFiles('tools/bootstrap_*.py', 'patches/**') }}
      - name: Bootstrap pinned inputs
        run: |
          python3 tools/bootstrap_openhsp.py
          python3 tools/bootstrap_audio.py
          python3 tools/bootstrap_macos_gui.py
      - name: Configure
        run: cmake --preset macos-arm64-legacy-cp932-release
      - name: Build
        run: cmake --build --preset macos-arm64-legacy-cp932-release
      - name: Test
        run: ctest --test-dir build/native-macos-arm64-legacy-cp932-release --output-on-failure --no-tests=error
      - name: Upload Release host
        uses: actions/upload-artifact@v4
        with:
          name: elona-gui-host-macos-arm64-${{ github.sha }}
          path: |
            build/native-macos-arm64-legacy-cp932-release/elona_gui_host
            build/native-macos-arm64-legacy-cp932-release/elona_hspcmp
          retention-days: 14
