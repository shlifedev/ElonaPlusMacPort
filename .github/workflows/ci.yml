name: CI

# Builds and tests what the repository can verify on its own.
# The original ElonaPlus 2.335 game is never available here, so game-play
# checks that need it (tests/game, save round trips) are out of scope.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest -v \
            tests/localization/source_transform/test_transform.py \
            tests/localization/source_transform/test_draft_keys.py

  macos:
    name: macOS arm64 (legacy CP932, debug)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Cache pinned upstream inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/upstream/OpenHSP
            .cache/audio
          key: upstream-macos-${{ hashFiles('tools/bootstrap_openhsp.py', 'tools/bootstrap_audio.py', 'patches/**') }}
      - name: Bootstrap OpenHSP and audio inputs
        run: |
          python3 tools/bootstrap_openhsp.py
          python3 tools/bootstrap_audio.py
      - name: Configure
        run: cmake --preset macos-arm64-legacy-cp932-debug
      - name: Build
        run: cmake --build --preset macos-arm64-legacy-cp932-debug
      - name: Test
        run: ctest --preset macos-arm64-legacy-cp932-debug --output-on-failure --no-tests=error

  windows:
    name: Windows x64 (legacy CP932, debug)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache pinned upstream inputs
        uses: actions/cache@v4
        with:
          path: |
            .cache/upstream/OpenHSP
            .cache/audio
          key: upstream-windows-${{ hashFiles('tools/bootstrap_openhsp.py', 'tools/bootstrap_audio.py', 'patches/**') }}
      - name: Bootstrap OpenHSP and audio inputs
        run: |
          python tools/bootstrap_openhsp.py
          python tools/bootstrap_audio.py
      # Mirrors tools/windows_build.ps1, the configuration verified on a real
      # Windows PC: Python-driven fixtures are disabled on Windows.
      - name: Configure
        run: cmake --preset windows-x64-legacy-cp932-debug -DBUILD_TESTING=ON -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE
      - name: Build
        run: cmake --build --preset windows-x64-legacy-cp932-debug
      - name: Test
        run: ctest --test-dir build/native-windows-x64-legacy-cp932-debug --output-on-failure --no-tests=error
