<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>ElonaPlus</title>
  <link rel="stylesheet" href="style.css">
  <script src="main.js" defer></script>
</head>
<body>
  <h1>ElonaPlus <small>2.335</small></h1>

  <label>게임 폴더</label>
  <div class="row">
    <span id="dir">선택 안 됨</span>
    <button id="pick">변경</button>
  </div>

  <label>언어</label>
  <div class="row lang">
    <button data-lang="ko">한국어</button>
    <button data-lang="original">日本語 / English</button>
  </div>

  <p id="msg"></p>
  <button id="play" class="play" disabled>시작</button>
</body>
</html>
